<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gigmate Web • Live Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #070B12; color: #E2E8F0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    header { background-color: #0C1322; border-bottom: 1px solid #1F2937; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .neon-cyan { color: #00F2FE; }
    .neon-magenta { color: #FF007F; }
    .status-badge { background: #111827; border: 1px solid #1F2937; border-radius: 20px; padding: 4px 10px; font-size: 11px; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #F59E0B; }
    .dot.green { background: #10B981; }
    
    nav { background: #090F1C; border-bottom: 1px solid #1F2937; display: flex; overflow-x: auto; padding: 0 12px; gap: 8px; }
    .tab-btn { background: none; border: none; border-bottom: 3px solid transparent; color: #94A3B8; font-weight: 700; font-size: 13px; padding: 12px 14px; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { color: #00F2FE; border-bottom-color: #00F2FE; }
    
    main { padding: 14px; max-width: 1100px; margin: 0 auto; }
    .card { background: #111827; border: 1px solid #1F2937; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .search-input { width: 100%; background: #070B12; border: 1px solid #374151; color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 13px; outline: none; margin-bottom: 12px; }
    .search-input:focus { border-color: #00F2FE; }
    
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { text-align: left; padding: 8px; color: #94A3B8; border-bottom: 1px solid #1F2937; font-size: 11px; text-transform: uppercase; }
    td { padding: 8px; border-bottom: 1px solid #1F2937; vertical-align: middle; }
    tr:active { background: #1E293B; }
    
    .badge-crate { background: rgba(255, 0, 127, 0.15); color: #FF80BF; border: 1px solid rgba(255, 0, 127, 0.3); border-radius: 6px; padding: 2px 6px; font-size: 10px; font-weight: bold; white-space: nowrap; }
    .img-thumb { width: 42px; height: 42px; object-fit: contain; background: #000; border-radius: 6px; border: 1px solid #374151; display: block; }
    .no-img { width: 42px; height: 42px; background: #1E293B; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #64748B; }
    
    .grid-locs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .loc-card { background: #111827; border: 1px solid #1F2937; border-radius: 10px; padding: 12px; }
    .loc-title { font-weight: bold; font-size: 14px; color: #fff; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .loc-item { padding: 6px 0; border-bottom: 1px solid #1E293B; display: flex; justify-content: space-between; font-size: 12px; }
    
    /* Modal */
    #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99; align-items: center; justify-content: center; padding: 16px; }
    .modal-box { background: #111827; border: 1px solid #374151; border-radius: 14px; width: 100%; max-width: 400px; padding: 18px; }
    .btn-close { width: 100%; background: #1F2937; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 13px; margin-top: 14px; cursor: pointer; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div>
      <span class="neon-cyan" style="font-weight: 900; font-size: 18px; letter-spacing: 1px;">GIGMATE</span>
      <span class="neon-magenta" style="font-size: 10px; font-weight: bold; margin-left: 6px;">CLOUD</span>
    </div>
    <div class="status-badge">
      <span id="conn-dot" class="dot"></span>
      <span id="conn-text">Verbinden...</span>
    </div>
  </header>

  <!-- Navigatietabs met inline directe functieaanroepen -->
  <nav>
    <button type="button" id="btn-inventory" class="tab-btn active" onclick="switchTab('inventory')">Voorraad (<span id="c-gear">0</span>)</button>
    <button type="button" id="btn-locations" class="tab-btn" onclick="switchTab('locations')">Kratten & Locaties</button>
    <button type="button" id="btn-projects" class="tab-btn" onclick="switchTab('projects')">Gigs (<span id="c-proj">0</span>)</button>
  </nav>

  <main>
    <!-- TAB 1: VOORRAAD -->
    <div id="tab-inventory-content">
      <input type="text" id="search-box" class="search-input" placeholder="🔍 Zoek artikel, barcode of krat..." oninput="renderGear()">
      <div class="card" style="padding: 0; overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Foto</th>
              <th>Code</th>
              <th>Naam</th>
              <th>Krat</th>
              <th style="text-align:center;">Aantal</th>
            </tr>
          </thead>
          <tbody id="gear-body">
            <tr><td colspan="5" style="text-align:center; padding: 24px; color: #64748B;">Laden uit cloud...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- TAB 2: KRATTEN & LOCATIES -->
    <div id="tab-locations-content" class="hidden">
      <div id="loc-grid" class="grid-locs">
        <div style="color:#64748B; padding:12px;">Locaties laden...</div>
      </div>
    </div>

    <!-- TAB 3: PROJECTEN -->
    <div id="tab-projects-content" class="hidden">
      <div id="proj-container">
        <div style="color:#64748B; padding:12px;">Projecten laden...</div>
      </div>
    </div>
  </main>

  <!-- MODAL DETAILS POPUP -->
  <div id="modal" onclick="closeModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div id="modal-img-wrap" style="text-align:center; margin-bottom:12px; background:#000; padding:6px; border-radius:8px;">
        <img id="modal-img" src="" style="max-height:220px; max-width:100%; object-fit:contain;">
      </div>
      <h2 id="modal-title" style="font-size:18px; font-weight:bold; color:#fff; margin-bottom:8px;"></h2>
      <div style="font-size:13px; line-height:1.8; color:#CBD5E1;">
        <div>Barcode: <b id="modal-code" class="neon-cyan" style="font-family:monospace;"></b></div>
        <div>Krat: <span id="modal-loc" class="badge-crate"></span></div>
        <div>Aantal: <b id="modal-qty"></b></div>
        <div style="margin-top:6px; font-size:12px; color:#94A3B8; font-style:italic;" id="modal-desc"></div>
      </div>
      <button type="button" class="btn-close" onclick="closeModal()">Sluiten</button>
    </div>
  </div>

  <script>
    var DB_BASE = "https://gigmate-5bcd7-default-rtdb.europe-west1.firebasedatabase.app";
    var allGear = [];
    var allProjects = [];

    // 1. Directe Tabwisselaar (onbreekbaar)
    function switchTab(name) {
      document.getElementById('tab-inventory-content').classList.add('hidden');
      document.getElementById('tab-locations-content').classList.add('hidden');
      document.getElementById('tab-projects-content').classList.add('hidden');

      document.getElementById('btn-inventory').classList.remove('active');
      document.getElementById('btn-locations').classList.remove('active');
      document.getElementById('btn-projects').classList.remove('active');

      document.getElementById('tab-' + name + '-content').classList.remove('hidden');
      document.getElementById('btn-' + name).classList.add('active');
    }

    // 2. Universele JSONP Callback: passeert alle mobiele CORS- en sandbox-restricties
    window.onCloudDataLoaded = function(data) {
      document.getElementById('conn-dot').className = "dot green";
      document.getElementById('conn-text').textContent = "Online";
      document.getElementById('conn-text').style.color = "#10B981";

      allGear = [];
      if (data && data.gear_items) {
        var g = data.gear_items;
        allGear = Array.isArray(g) ? g.filter(Boolean) : Object.values(g);
      }
      document.getElementById('c-gear').textContent = allGear.length;
      renderGear();
      renderLocations();

      allProjects = [];
      if (data && data.projects) {
        var p = data.projects;
        allProjects = Array.isArray(p) ? p.filter(Boolean) : Object.values(p);
      }
      document.getElementById('c-proj').textContent = allProjects.length;
      renderProjects();
    };

    function fetchCloud() {
      var old = document.getElementById("jsonp-script");
      if (old) old.remove();

      var script = document.createElement("script");
      script.id = "jsonp-script";
      script.src = DB_BASE + "/.json?callback=onCloudDataLoaded&_t=" + Date.now();
      script.onerror = function() {
        document.getElementById('conn-dot').className = "dot";
        document.getElementById('conn-text').textContent = "Offline";
        document.getElementById('conn-text').style.color = "#F59E0B";
      };
      document.body.appendChild(script);
    }

    // Direct starten en elke 3s verversen
    fetchCloud();
    setInterval(fetchCloud, 3000);

    // 3. Render Voorraad
    function renderGear() {
      var q = (document.getElementById('search-box').value || "").toLowerCase();
      var tbody = document.getElementById('gear-body');
      
      var filtered = allGear.filter(function(i) {
        return (i.name || "").toLowerCase().indexOf(q) > -1 ||
               (i.qrCode || "").toLowerCase().indexOf(q) > -1 ||
               (i.defaultLocation || "").toLowerCase().indexOf(q) > -1;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:#64748B;">Geen artikelen gevonden</td></tr>';
        return;
      }

      var html = "";
      for (var i = 0; i < filtered.length; i++) {
        var item = filtered[i];
        var imgTag = item.photoUri 
          ? '<img src="' + item.photoUri + '" class="img-thumb">' 
          : '<div class="no-img">Geen</div>';

        html += '<tr onclick="openModal(\'' + encodeURIComponent(item.qrCode || '') + '\')">' +
                  '<td>' + imgTag + '</td>' +
                  '<td class="neon-cyan" style="font-family:monospace; font-weight:bold;">' + (item.qrCode || '-') + '</td>' +
                  '<td style="font-weight:bold; color:#fff;">' + (item.name || '-') + '</td>' +
                  '<td><span class="badge-crate">📦 ' + (item.defaultLocation || '-') + '</span></td>' +
                  '<td style="text-align:center; font-weight:bold;">' + (item.quantity || 1) + '</td>' +
                '</tr>';
      }
      tbody.innerHTML = html;
    }

    // 4. Render Kratten
    function renderLocations() {
      var grid = document.getElementById('loc-grid');
      var byLoc = {};
      
      for (var i = 0; i < allGear.length; i++) {
        var loc = (allGear[i].defaultLocation || "Overig").trim();
        if (!byLoc[loc]) byLoc[loc] = [];
        byLoc[loc].push(allGear[i]);
      }

      var keys = Object.keys(byLoc).sort();
      if (keys.length === 0) {
        grid.innerHTML = '<div style="color:#64748B; padding:12px;">Geen locaties gevonden.</div>';
        return;
      }

      var html = "";
      for (var j = 0; j < keys.length; j++) {
        var locName = keys[j];
        var items = byLoc[locName];
        
        html += '<div class="loc-card">' +
                  '<div class="loc-title"><span>📦 ' + locName + '</span><span style="font-size:11px; color:#94A3B8;">' + items.length + ' artikelen</span></div>';
        
        for (var k = 0; k < items.length; k++) {
          var it = items[k];
          html += '<div class="loc-item" onclick="openModal(\'' + encodeURIComponent(it.qrCode || '') + '\')">' +
                    '<span style="color:#fff;">' + it.name + '</span>' +
                    '<span class="neon-cyan" style="font-weight:bold;">' + (it.quantity || 1) + 'x</span>' +
                  '</div>';
        }
        html += '</div>';
      }
      grid.innerHTML = html;
    }

    // 5. Render Projecten
    function renderProjects() {
      var cont = document.getElementById('proj-container');
      if (allProjects.length === 0) {
        cont.innerHTML = '<div class="card" style="text-align:center; color:#64748B;">Nog geen evenementen in de cloud.</div>';
        return;
      }

      var html = "";
      for (var i = 0; i < allProjects.length; i++) {
        var p = allProjects[i];
        var pItems = p.items ? (Array.isArray(p.items) ? p.items.filter(Boolean) : Object.values(p.items)) : [];
        
        html += '<div class="card">' +
                  '<h2 style="font-size:16px; font-weight:bold; color:#fff;">' + (p.name || 'Naamloos') + '</h2>' +
                  '<div style="font-size:11px; color:#94A3B8; margin-top:2px; margin-bottom:10px;">📍 ' + (p.location || '-') + ' • 📅 ' + (p.date || '-') + '</div>';

        if (pItems.length > 0) {
          html += '<table><thead><tr><th>Apparaat</th><th>Krat</th><th style="text-align:center;">In</th><th style="text-align:center;">Uit</th></tr></thead><tbody>';
          for (var j = 0; j < pItems.length; j++) {
            var item = pItems[j];
            html += '<tr>' +
                      '<td style="color:#fff; font-weight:bold;">' + (item.gearName || item.gearQr) + '</td>' +
                      '<td><span class="badge-crate">📦 ' + (item.defaultLocation || '-') + '</span></td>' +
                      '<td style="text-align:center; color:#00F2FE; font-weight:bold;">' + (item.loadedInCount || 0) + '/' + (item.requiredCount || 1) + '</td>' +
                      '<td style="text-align:center; color:#FF007F; font-weight:bold;">' + (item.loadedOutCount || 0) + '</td>' +
                    '</tr>';
          }
          html += '</tbody></table>';
        } else {
          html += '<div style="font-size:12px; color:#64748B; font-style:italic;">Geen artikelen toegevoegd.</div>';
        }
        html += '</div>';
      }
      cont.innerHTML = html;
    }

    // 6. Modal Popup Functies
    function openModal(encCode) {
      var code = decodeURIComponent(encCode);
      var item = allGear.find(function(g) { return (g.qrCode || "").toLowerCase() === code.toLowerCase(); });
      if (!item) return;

      document.getElementById('modal-title').textContent = item.name || 'Artikel';
      document.getElementById('modal-code').textContent = item.qrCode || '-';
      document.getElementById('modal-loc').textContent = '📦 ' + (item.defaultLocation || '-');
      document.getElementById('modal-qty').textContent = (item.quantity || 1) + ' stuk(s)';
      document.getElementById('modal-desc').textContent = item.description || 'Geen opmerkingen.';

      var imgWrap = document.getElementById('modal-img-wrap');
      var img = document.getElementById('modal-img');
      if (item.photoUri) {
        img.src = item.photoUri;
        imgWrap.style.display = 'block';
      } else {
        imgWrap.style.display = 'none';
      }

      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
